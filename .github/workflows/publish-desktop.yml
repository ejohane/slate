name: Publish desktop builds

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pr_title:
        description: Conventional Commit title to use for the release bump
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  prepare:
    name: Prepare release version
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):') }}
    outputs:
      bump: ${{ steps.release.outputs.bump }}
      previous_version: ${{ steps.release.outputs.previous_version }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare release commit and tag
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR_TITLE: ${{ inputs.pr_title }}
        run: node .github/scripts/prepare-release.mjs

      - name: Push release commit and tag
        run: |
          git push origin HEAD:main
          git push origin "${{ steps.release.outputs.tag }}"

  build:
    name: Build macOS
    runs-on: macos-latest
    needs: prepare

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Confirm release version
        run: node -e "const pkg = require('./package.json'); if (pkg.version !== '${{ needs.prepare.outputs.version }}') process.exit(1);"

      - name: Run lint
        run: npm run lint

      - name: Run tests
        shell: bash
        run: |
          if npm pkg get scripts.test | grep -qv '^{}$\|^null$'; then
            npm test
          else
            echo "::notice::No npm test script is configured yet."
          fi

      - name: Build distributables
        run: npm run dist -- --publish never

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: slate-macos
          path: |
            release/*.blockmap
            release/*.dmg
            release/*.zip
            release/latest*.yml
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Download build files
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          gh release create "$TAG_NAME" release-artifacts/* \
            --target "$RELEASE_SHA" \
            --title "Slate $RELEASE_VERSION" \
            --notes "Automated desktop build from $GITHUB_SHA." \
            --latest
